name: Telegram main notifications

on:
  push:
    branches: [main]

permissions:
  pull-requests: read
  id-token: write

jobs:
  notify:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Notify the Vilar Telegram relay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          def read_json(url, headers, data=None):
              request = Request(url, headers=headers, data=data)
              with urlopen(request, timeout=12) as response:
                  return json.load(response)

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          repo = os.environ["GITHUB_REPOSITORY"]
          head = event["after"]
          github = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
          pulls_url = f"{os.environ['GITHUB_API_URL']}/repos/{repo}/commits/{head}/pulls"
          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&" + urlencode({"audience": "vilar-main-telegram"})
          endpoint = "https://45.15.166.53/vilar/hooks/github-main"
          for attempt in range(4):
              try:
                  pulls = read_json(pulls_url, github)
                  pr = next((p for p in pulls if p["merged_at"] and p["base"]["ref"] == "main"
                             and p["base"]["repo"]["full_name"] == repo and p["merge_commit_sha"] == head), None)
                  identity = read_json(oidc_url, {"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
                  data = json.dumps({
                      "pr": pr["number"] if pr else None,
                      "pr_author": (pr.get("user") or {}).get("login") if pr else None,
                      "before": event["before"],
                      "multiple": len(event.get("commits", [])) > 1,
                  }).encode()
                  result = read_json(endpoint, {"Authorization": "Bearer " + identity["value"], "Content-Type": "application/json"}, data)
                  if result.get("ok") is not True:
                      raise RuntimeError("Telegram delivery was not confirmed")
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(2 ** (attempt + 1))
          PY
