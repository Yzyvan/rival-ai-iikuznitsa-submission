[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vilar-outlook-graph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
import-mail = ["mcp==2.3.0"]

[tool.setuptools]
py-modules = ["vilar_graph"]
